name: Mazebound
version: 1.0
main: net.mazebound.Mazebound
api-version: '1.21'
author: Silva44444
description: The Mazebound exploration server plugin

commands:
  profile:
    description: View your Mazebound profile
    usage: /profile

  discover:
    description: Test cell discovery
    usage: /discover

  mazetest:
    description: Tests the maze generator
    usage: /mazetest [seed]

  worldplantest:
    description: Tests the world planner
    usage: /worldplantest [seed]

  buildcell:
    description: Builds a test maze cell
    usage: /buildcell [x] [z]

  spawnmaze:
    description: Spawns a 5x5 test maze
    usage: /spawnmaze [seed]

  herbgarden:
    description: Manage Healing Herb garden plants
    usage: /herbgarden add|remove|list

  waystone:
    description: Manage and test Mazebound waystones
    usage: /waystone set|remove|list|give
    permission: mazebound.waystone.admin
    permission-message: "You don't have permission to manage waystones."

permissions:
  mazebound.waystone.admin:
    description: Allows registering and removing waystones and giving test runes
    default: op
